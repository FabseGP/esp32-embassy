[target.xtensa-esp32s2-none-elf]
runner = "espflash flash --monitor --chip esp32s2 --log-format defmt"

[env]
DEFMT_LOG="info"

[build]
rustflags = [
  "-C", "link-arg=-nostartfiles",
  "-Z", "stack-protector=all",
]

target = "xtensa-esp32s2-none-elf"

[unstable]
build-std = ["alloc", "core"]
#build-std-features = ["panic_immediate_abort"]
