[alias]
run-esp32c6 = "run --release --target riscv32imac-unknown-none-elf --config=./.cargo/config_esp32c6.toml --features=esp32c6"
run-esp32 = "run --release --target xtensa-esp32-none-elf --config=./.cargo/config_esp32.toml --features=esp32"
run-esp32s2 = "run --release --target xtensa-esp32s2-none-elf --config=./.cargo/config_esp32s2.toml --features=esp32s2"
build-esp32c6 = "build --release --target riscv32imac-unknown-none-elf --config=./.cargo/config_esp32c6.toml --features=esp32c6"
build-esp32 = "build --release --target xtensa-esp32-none-elf --config=./.cargo/config_esp32.toml --features=esp32"
build-esp32s2 = "build --release --target xtensa-esp32s2-none-elf --config=./.cargo/config_esp32s2.toml --features=esp32s2"
clippy-esp32c6 = "clippy --target riscv32imac-unknown-none-elf --config=./.cargo/config_esp32c6.toml --features=esp32c6"
clippy-esp32 = "clippy --target xtensa-esp32-none-elf --config=./.cargo/config_esp32.toml --features=esp32"
clippy-esp32s2 = "clippy --target xtensa-esp32s2-none-elf --config=./.cargo/config_esp32s2.toml --features=esp32s2"
check-esp32c6 = "check --target riscv32imac-unknown-none-elf --config=./.cargo/config_esp32c6.toml --features=esp32c6"
check-esp32 = "check --target xtensa-esp32-none-elf --config=./.cargo/config_esp32.toml --features=esp32"
check-esp32s2 = "check --target xtensa-esp32s2-none-elf --config=./.cargo/config_esp32s2.toml --features=esp32s2"
debug-esp32c6 = "run --target riscv32imac-unknown-none-elf --config=./.cargo/config_esp32c6.toml --features=esp32c6"
debug-esp32 = "run --target xtensa-esp32-none-elf --config=./.cargo/config_esp32.toml --features=esp32"
debug-esp32s2 = "run --target xtensa-esp32s2-none-elf --config=./.cargo/config_esp32s2.toml --features=esp32s2"

[target.'cfg(target_arch = "riscv32")']
runner = "espflash flash --monitor --log-format defmt"
rustflags = [
  "-C", "force-frame-pointers",
  "-Z", "stack-protector=all",
]

[target.'cfg(target_arch = "xtensa")']
runner = "espflash flash --monitor --log-format defmt"
rustflags = [
  "-C", "link-arg=-nostartfiles",
  "-Z", "stack-protector=all",
]

[env]
DEFMT_LOG="info"

[build]
rustflags = ["-Z", "threads=8"]

[unstable]
gc = true
build-std = ["alloc", "core"]
