cargo-features = ["panic-immediate-abort"]

[package]
edition      = "2024"
name         = "fabseesp"
rust-version = "1.93"
version      = "0.1.0"

[dependencies]
esp-hal = { version = "1.0", features = ["defmt", "esp32s2", "unstable"] }
esp-rtos = { version = "0.2.0", features = [
  "defmt",
  "embassy",
  "esp32s2",
  "esp-radio"
] }
defmt = "1.0.1"
esp-bootloader-esp-idf = { version = "0.4.0", features = ["defmt", "esp32s2"] }
embassy-executor = { version = "0.9.1", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
esp-backtrace = { version = "0.18.1", features = [
  "defmt",
  "esp32s2",
  "panic-handler",
] }
esp-println = { version = "0.16.1", features = ["defmt-espflash", "esp32s2"] }
embassy-net = { version = "0.8.0", features = [
    "dhcpv4",
    "medium-ethernet",
    "tcp",
    "udp",
    "defmt"
] }
esp-alloc = "0.9.0"
esp-radio = { version = "0.17", features = [
    "defmt",
    "wifi",
    "esp32s2",
] }
static_cell = { version = "2.1.1", features = ["nightly"] }
picoserve = { version = "0.18.0", features = ["embassy"] }

[profile.dev]
opt-level = "s"
debug = "line-tables-only"
panic = "immediate-abort"

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = 's'
panic = "immediate-abort"
