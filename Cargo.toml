cargo-features = ["panic-immediate-abort"]

[package]
edition      = "2024"
name         = "fabseesp"
version      = "0.1.0"

[dependencies]
esp-hal = { git = "https://github.com/esp-rs/esp-hal.git", features = ["defmt", "unstable"] }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal.git", features = [
  "defmt",
  "embassy",
  "esp-radio"
] }
defmt = "1.0.1"
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal.git", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal.git", features = [
  "defmt",
  "panic-handler",
] }
esp-println = { git = "https://github.com/esp-rs/esp-hal.git", features = ["defmt-espflash"] }
embassy-net = { version = "0.9.1", features = [
    "dhcpv4",
    "medium-ethernet",
    "tcp",
    "udp",
    "defmt",
    "dns",
] }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal.git", features = ["defmt"] }
esp-radio = { git = "https://github.com/esp-rs/esp-hal.git", features = [
    "defmt",
    "wifi",
    "esp-alloc",
    "unstable",
] }
esp-storage = { git = "https://github.com/esp-rs/esp-hal.git", features = ["defmt"] }
esp-hal-ota = { git = "https://github.com/lampaBiurkowa/esp-hal-ota.git", features = ["defmt"] }
static_cell = { version = "2.1.1", features = ["nightly"] }
picoserve = { version = "0.19.0", features = ["embassy", "defmt", "json"] }
ssd1306 = { version = "0.10.0", features = ["async"] }
embedded-graphics = { version = "0.8.2", features = ["defmt"] }
tinybmp = "0.7.0"
embassy-sync = "0.8.0"
nb = "1.1.0"
reqwless = { version = "0.14.0", default-features = false, features = [
    "defmt",
] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
smoltcp = { version = "0.13.1", default-features = false, features = [
    "defmt",
    "medium-ethernet",
    "multicast",
    "proto-dhcpv4",
    "proto-dns",
    "proto-ipv4",
    "socket-dns",
    "socket-icmp",
    "socket-raw",
    "socket-tcp",
    "socket-udp",
    "dns-max-server-count-4", 
] }
heapless = { version = "0.9.3", features = ["defmt"] }
embassy-futures = { version = "0.1.2", features = ["defmt"] }
trouble-host = { version = "0.6.0", features = ["gatt", "defmt", "derive"], optional = true }
bt-hci = { version = "0.9.0", features = ["defmt"], optional = true }
embedded-hal = "1.0.0"
rust-mqtt = { version = "0.5.1", features = ["defmt"] }

[build-dependencies]
dotenvy = "0.15.7"

[profile.dev]
opt-level = "s"
debug = "line-tables-only"
panic = "immediate-abort"

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = 's'
panic = "immediate-abort"

[features]
esp32c6 = [
    "esp-backtrace/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
    "esp-rtos/esp32c6",
    "esp-hal/esp32c6",
    "esp-radio/esp32c6",
    "esp-radio/ble",
    "esp-println/esp32c6",
    "trouble-host",
    "bt-hci",
]

esp32 = [
    "esp-backtrace/esp32",
    "esp-bootloader-esp-idf/esp32",
    "esp-rtos/esp32",
    "esp-hal/esp32",
    "esp-storage/esp32",
    "esp-hal-ota/esp32",
    "esp-radio/esp32",
    "esp-radio/ble",
    "esp-println/esp32",
    "trouble-host",
    "bt-hci",
]

esp32s2 = [
    "esp-backtrace/esp32s2",
    "esp-bootloader-esp-idf/esp32s2",
    "esp-rtos/esp32s2",
    "esp-hal/esp32s2",
    "esp-radio/esp32s2",
    "esp-println/esp32s2",
]

[lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
absolute_paths = "warn"
allow_attributes = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
error_impl_error = "warn"
expect_used = "warn"
field_scoped_visibility_modifiers = "warn"
if_then_some_else_none = "warn"
implicit_clone = "warn"
indexing_slicing = "warn"
infinite_loop = "warn"
large_include_file = "warn"
mod_module_files = "warn"
panic = "warn"
panic_in_result_fn = "warn"
print_stdout = "warn"
redundant_type_annotations = "warn"
return_and_then = "warn"
str_to_string = "warn"
unneeded_field_pattern = "warn"
verbose_file_reads = "warn"
use_debug = "warn"
unwrap_in_result = "warn"
unused_trait_names = "warn"
unused_result_ok = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
